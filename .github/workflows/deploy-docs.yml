name: Deploy Docsify Documentation to GitHub Pages

on:
    push:
        branches: [main]
        paths:
            - "docs/**"
            - "api-reference/**"
            - ".gitbook/**"
            - "*.md"
            - "_sidebar.md"
            - "index.html"
            - ".github/workflows/deploy-docs.yml"

    # Allow manual trigger
    workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write

# Allow only one concurrent deployment
concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: 📥 Checkout Repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: 📝 Prepare Documentation Site
              run: |
                  # Create _site directory
                  mkdir -p _site

                  # Copy all necessary files
                  cp index.html _site/
                  cp _sidebar.md _site/
                  cp README.md _site/
                  cp -r docs _site/ || echo "No docs directory"
                  cp -r api-reference _site/ || echo "No api-reference directory"
                  cp -r .gitbook _site/ || echo "No .gitbook directory"

                  # Copy other markdown files
                  cp SUMMARY.md _site/ || echo "No SUMMARY.md"
                  cp CONTRIBUTING_DOCS.md _site/ || echo "No CONTRIBUTING_DOCS.md"
                  cp GITBOOK_SETUP.md _site/ || echo "No GITBOOK_SETUP.md"
                  cp GITHUB_PAGES_SETUP.md _site/ || echo "No GITHUB_PAGES_SETUP.md"
                  cp MAP_INTEGRATION_START_HERE.md _site/ || echo "No MAP_INTEGRATION_START_HERE.md"
                  cp CALL_FUNCTIONS_SETUP.md _site/ || echo "No CALL_FUNCTIONS_SETUP.md"

                  # Create .nojekyll to disable Jekyll processing
                  touch _site/.nojekyll

                  echo "✅ Documentation site prepared successfully"

            - name: 📋 List Build Output
              run: |
                  echo "📂 Build output structure:"
                  ls -la _site/
                  echo ""
                  echo "📄 Files in _site:"
                  find _site -type f | head -20

            - name: 📤 Upload Artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: "_site"

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: 🚀 Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4

            - name: ✅ Deployment Complete
              run: |
                  echo "🎉 Documentation deployed successfully!"
                  echo "📚 URL: ${{ steps.deployment.outputs.page_url }}"
                  echo ""
                  echo "Your documentation is now live!"
